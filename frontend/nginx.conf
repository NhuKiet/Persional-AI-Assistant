# Nén văn bản trước khi gửi: JS + CSS lúc mở trang giảm từ ~370 KB còn ~107 KB.
# SSE (text/event-stream) không nằm trong danh sách nên token vẫn ra ngay.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

# mime.types của nginx không biết đuôi .mjs và trả application/octet-stream;
# trình duyệt từ chối chạy module script không mang kiểu JavaScript, nên
# worker của pdf.js (pdf.worker.min-*.mjs) không nạp được.
types {
    application/javascript mjs;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Không khoe phiên bản nginx trong header Server và trang lỗi.
    server_tokens off;

    # SPA fallback: react-router dùng path thật (/research, /coding…), nên mọi
    # đường dẫn không khớp file tĩnh phải trả về index.html để router xử lý,
    # thay vì 404. Nếu không, F5 ở /research sẽ vỡ.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Trang chỉ được chạy script và nạp dữ liệu từ chính origin này: một
        # đoạn script lọt vào trang (XSS) không tải thêm mã hay gửi dữ liệu đi
        # nơi khác được. 'unsafe-inline' chỉ cho style — KaTeX và Plotly gắn
        # style trực tiếp vào phần tử; script nội tuyến thì bị cấm hẳn.
        # blob: cho worker của pdf.js/Plotly và ảnh tạo trong trang.
        # Ra ngoài origin chỉ có ba ngoại lệ, đúng những gì giao diện đang dùng:
        # hai host của Google Fonts (@import trong styles/base.css, news.css)
        # và API thời tiết Open-Meteo (hooks/useTimeAndWeather.ts).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.open-meteo.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # index.html không có hash trong tên: phải hỏi lại server mỗi lần, kẻo
        # sau khi deploy trình duyệt vẫn giữ bản cũ trỏ tới asset đã bị xoá.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Backend cùng origin với trang (xem src/lib/api.ts): cookie đăng nhập đi
    # kèm mọi request mà không cần CORS.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Backend tự gắn nosniff cho vài response; chỉ giữ một bản ở trên.
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # GHI ĐÈ, không nối thêm ($proxy_add_x_forwarded_for): giá trị do trình
        # duyệt tự gửi sẽ bị bỏ, nên khách không giả IP để reset hạn mức dùng
        # thử hay rate limit được.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: đẩy từng token ra ngay, không gom vào buffer.
        proxy_buffering off;
        proxy_cache off;
        # Một lượt Research có thể chạy vài phút.
        proxy_read_timeout 1800s;
        # PDF upload tối đa 50 MB (MAX_UPLOAD_MB của backend).
        client_max_body_size 55m;
    }

    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        # Without it nginx sends "Host: backend:8000", which the backend's
        # ALLOWED_HOSTS check refuses ("Invalid host header").
        proxy_set_header Host $host;
    }

    # Cache asset có hash tên file — an toàn để cache lâu.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
