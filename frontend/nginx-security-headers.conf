# Sent with every response. Kept in a file of its own and `include`d in each
# location of nginx.conf: nginx drops the add_header lines inherited from the
# server block as soon as a location declares one of its own.

# Never guess a type from the bytes: an uploaded file must not turn into a script.
add_header X-Content-Type-Options "nosniff" always;
# Nothing may put this app in a frame (clickjacking). Older browsers read this
# one; newer ones read frame-ancestors in the page's Content-Security-Policy.
add_header X-Frame-Options "DENY" always;
# Only over HTTPS (see the $hsts map in nginx.conf); empty means not sent.
add_header Strict-Transport-Security $hsts always;
# Session ids are part of the paths: other sites get the origin at most.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# What the app itself uses — the microphone button and the weather widget's
# location — stays available to it; nothing embedded may use any of these.
add_header Permissions-Policy "microphone=(self), geolocation=(self), camera=(), payment=(), usb=()" always;
