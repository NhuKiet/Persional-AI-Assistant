[project]
name = "king-ai"
version = "3.0.0"
description = "KiNg AI — Research + Chat + Coding + PDF backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "starlette==1.3.1",
    "python-multipart==0.0.31",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "httpcore==1.0.9",
    "anyio==4.14.2",
    "h11==0.16.0",
    "langchain-core",
    "langchain-ollama==1.0.1",
    "langchain-anthropic==1.4.8",
    "langchain-openai==1.3.3",
    "langchain-text-splitters==1.1.2",
    "ollama==0.6.1",
    "FlagEmbedding>=1.2.10",
    "torch",
    "weaviate-client>=4.9,<5",
    "tavily==1.1.0",
    "arxiv==3.0.0",
    "ddgs>=9.0.0",
    "beautifulsoup4==4.14.3",
    "feedparser==6.0.12",
    "lxml==6.1.3",
    "trafilatura>=1.12.0",
    "PyMuPDF==1.27.2.2",
    "matplotlib==3.10.8",
    "pillow==12.3.0",
    "pyarrow==23.0.1",
    "openpyxl",
    "sympy==1.14.0",
    "networkx==3.6.1",
    "huggingface_hub==1.7.1",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "transformers==5.10.4",
    "python-dotenv",
    "tenacity==9.1.4",
    "PyYAML==6.0.3",
    "orjson==3.11.7",
    "requests-toolbelt==1.0.0",
    "pydantic-settings",
    "psycopg[binary,pool]==3.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# data/ chứa code do Coding Agent sinh ra; .worktrees là bản sao của chính repo.
extend-exclude = ["data", ".worktrees", "frontend", "node_modules"]

[tool.ruff.lint]
# Chỉ bắt lỗi thật, không bắt kiểu cách: lỗi cú pháp và import (E4/E7/E9),
# tên chưa định nghĩa hoặc không dùng (F), và các bẫy quen thuộc (B). Thứ tự
# import và định dạng code cố ý để yên — không ai muốn một diff nghìn dòng.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E731",  # gán lambda cho một tên: gọn cho test double
    "E741",  # biến tên `l` (một dòng, một phần tử)
    "B905",  # zip(strict=True) biến một lệch độ dài đang được chấp nhận thành crash
]

[tool.ruff.lint.per-file-ignores]
# Test và tool chỉnh sys.path / biến môi trường rồi mới import app.
"tests/**" = ["E402"]
"tools/**" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI đọc các lời gọi này trong chữ ký hàm như khai báo, không phải giá trị mặc định.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.uv]
package = false

# Container chạy Linux (Docker) và có GPU NVIDIA (RTX 3050) — build torch bản
# CUDA cho platform đó thay vì bản CPU-only mặc định trên PyPI, để reranker
# (FlagEmbedding) chạy trên GPU. macOS vẫn dùng torch CPU từ PyPI.
#
# Windows host cũng lấy bản CUDA (cu126 — driver 560.x hỗ trợ tối đa CUDA
# 12.6): SwinCoMER (HMER) chạy CPU mất ~415 s/ảnh, không dùng được. Hệ quả
# phụ: reranker trên Windows cũng lên GPU, chung 4GB VRAM với HMER — xem
# asyncio.Lock trong hmer/service.py. Số đo: docs/superpowers/specs/
# 2026-09-23-hmer-attention-and-ink-canvas-design.md §13.1.
#
# Linux dùng chung kho cu126 với Windows: kho cu121 dừng ở torch 2.5, nên
# image Docker và CI từng kẹt ở 2.4.1 với hàng chục lỗ hổng đã có bản vá.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
