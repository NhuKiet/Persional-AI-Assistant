[project]
name = "king-ai"
version = "3.0.0"
description = "KiNg AI — Research + Chat + Coding + PDF backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "starlette==1.0.0",
    "python-multipart==0.0.22",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "httpcore==1.0.9",
    "anyio==4.12.1",
    "h11==0.16.0",
    "langchain==1.2.12",
    "langchain-core",
    "langchain-community==0.4.1",
    "langchain-ollama==1.0.1",
    "langchain-anthropic==1.4.8",
    "langchain-openai==1.3.3",
    "langchain-text-splitters==1.1.1",
    "langgraph==1.1.2",
    "ollama==0.6.1",
    "FlagEmbedding>=1.2.10",
    "weaviate-client>=4.9,<5",
    "tavily==1.1.0",
    "arxiv==2.4.1",
    "wikipedia==1.4.0",
    "beautifulsoup4==4.14.3",
    "feedparser==6.0.12",
    "lxml==6.0.2",
    "trafilatura>=1.12.0",
    "PyMuPDF==1.27.2.2",
    "matplotlib==3.10.8",
    "pillow==12.1.1",
    "pyarrow==23.0.1",
    "openpyxl",
    "sympy==1.14.0",
    "networkx==3.6.1",
    "huggingface_hub==1.7.1",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "transformers==5.3.0",
    "python-dotenv",
    "tenacity==9.1.4",
    "PyYAML==6.0.3",
    "orjson==3.11.7",
    "requests-toolbelt==1.0.0",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
