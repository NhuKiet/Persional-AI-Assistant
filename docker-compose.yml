# KiNg — chạy toàn bộ stack bằng: docker compose up --build
# Yêu cầu: file .env ở thư mục gốc (copy từ .env.example rồi điền key).

services:
  backend:
    build: .
    ports:
      # Chỉ nghe trên loopback: trình duyệt đi qua nginx của frontend (cùng
      # origin, cookie đăng nhập). "8000:8000" trần sẽ bind 0.0.0.0 — cả mạng
      # LAN gọi được, và Docker còn vượt qua firewall máy host (ufw). Mở ra
      # ngoài thì đặt OWNER_PASSWORD + ALLOWED_HOSTS và đặt HTTPS phía trước.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Trong container, "localhost"/127.0.0.1 trỏ về chính container. Ollama
      # và Supabase Postgres (local, qua `supabase start`) đều chạy trên MÁY
      # HOST nên phải gọi qua host.docker.internal. Ghi đè giá trị trong .env.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL_DOCKER}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cho container thấy GPU NVIDIA của host (dùng cho BGE reranker qua torch).
    # Cần Docker Desktop đã bật GPU support (WSL2 backend + driver NVIDIA hỗ
    # trợ CUDA on WSL). Không có GPU/driver thì torch tự rơi về CPU, không lỗi.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Giữ dữ liệu runtime (pdf, sandbox) ngoài container.
      - ./data:/app/data
      # Cache model HuggingFace (BGE reranker, ~2GB) — không có volume này thì
      # mỗi lần rebuild/restart container phải tải lại từ đầu, khiến câu hỏi
      # research ĐẦU TIÊN sau restart bị treo hàng phút chờ tải model.
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Không đặt VITE_API_URL: trang gọi "/api/…" cùng origin và nginx
      # (frontend/nginx.conf) chuyển sang backend — cookie đăng nhập mới chạy.
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Cloudflare Tunnel (tuỳ chọn) ───────────────────────────────────────
  # HTTPS và một địa chỉ công khai mà không mở cổng nào trên máy hay router:
  # container này tự gọi RA Cloudflare, Cloudflare đưa request của khách vào
  # qua chính kết nối đó. Chỉ chạy khi gọi tên profile (xem README):
  #   docker compose --profile tunnel up -d         tên miền riêng, cần CLOUDFLARE_TUNNEL_TOKEN
  #   docker compose --profile tunnel-quick up -d   địa chỉ tạm *.trycloudflare.com để thử
  # Hai service dùng CHUNG một địa chỉ cố định — đúng địa chỉ duy nhất mà nginx
  # tin khi đọc IP thật của khách (frontend/nginx.conf) — nên không chạy cả hai
  # cùng lúc. tests/test_tunnel_config.py canh sự khớp nhau này.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Lấy từ .env; trong trang Cloudflare, tunnel trỏ về http://frontend:80.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    networks:
      default:
        ipv4_address: 172.30.250.10
    restart: unless-stopped

  tunnel-quick:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel-quick"]
    # Địa chỉ được in trong log: docker compose logs tunnel-quick
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      default:
        ipv4_address: 172.30.250.10
    restart: "no"

# Dải địa chỉ cố định cho stack này. Docker chỉ cấp phát trong ip_range (nửa
# trên); địa chỉ của tunnel nằm ngoài dải đó, nên không container nào khác vô
# tình nhận được địa chỉ mà nginx tin.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.250.0/24
          ip_range: 172.30.250.128/25
          gateway: 172.30.250.1

# ── Ollama (tuỳ chọn) ────────────────────────────────────────────────
# Mặc định dùng Ollama đã cài trên máy host (qua host.docker.internal ở trên).
# Muốn đóng gói Ollama vào compose: bỏ comment khối dưới, và đổi OLLAMA_URL của
# backend thành http://ollama:11434.
#
#  ollama:
#    image: ollama/ollama
#    ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    restart: unless-stopped
#
#volumes:
#  ollama_data:

volumes:
  hf_cache:
